<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>GyanCode - System Sequence Diagram</title>
<style>
* { box-sizing: border-box; }
body {
    background: #f0f2f5;
    font-family: Arial, sans-serif;
    display: flex; justify-content: center; padding: 40px; margin: 0;
}
.diagram-container {
    background: #fff;
    border: 2px solid #333; /* Dark border as in the reference image */
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    padding: 20px 10px;
}
svg {
    display: block;
}
text {
    font-size: 12px;
    font-family: Arial, sans-serif;
    fill: #000;
}
</style>
</head>
<body>

<div class="diagram-container">
<svg width="850" height="900">
  <defs>
    <!-- Solid Arrowhead for Request Calls -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0,0 L 10,5 L 0,10 Z" fill="#000"/>
    </marker>
    <!-- Open Arrowhead for Returns -->
    <marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0,0 L 10,5 L 0,10" fill="none" stroke="#000" stroke-width="1.3"/>
    </marker>
  </defs>

  <!-- ==================== LIFELINES ==================== -->
  <line x1="100" y1="80" x2="100" y2="880" stroke="#000" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="300" y1="80" x2="300" y2="880" stroke="#000" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="550" y1="80" x2="550" y2="880" stroke="#000" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="750" y1="80" x2="750" y2="880" stroke="#000" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ==================== HEADER LABELS & SYMBOLS ==================== -->
  <!-- Educator Stick Figure -->
  <g transform="translate(100, 30)">
    <text x="0" y="-15" text-anchor="middle" font-size="12">Educator</text>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#000" stroke-width="1.2"/>
    <line x1="0" y1="7" x2="0" y2="25" stroke="#000" stroke-width="1.2"/>
    <line x1="-12" y1="12" x2="12" y2="12" stroke="#000" stroke-width="1.2"/>
    <line x1="0" y1="25" x2="-8" y2="40" stroke="#000" stroke-width="1.2"/>
    <line x1="0" y1="25" x2="8" y2="40" stroke="#000" stroke-width="1.2"/>
  </g>

  <!-- Student Stick Figure -->
  <g transform="translate(300, 30)">
    <text x="0" y="-15" text-anchor="middle" font-size="12">Student</text>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#000" stroke-width="1.2"/>
    <line x1="0" y1="7" x2="0" y2="25" stroke="#000" stroke-width="1.2"/>
    <line x1="-12" y1="12" x2="12" y2="12" stroke="#000" stroke-width="1.2"/>
    <line x1="0" y1="25" x2="-8" y2="40" stroke="#000" stroke-width="1.2"/>
    <line x1="0" y1="25" x2="8" y2="40" stroke="#000" stroke-width="1.2"/>
  </g>

  <!-- GyanCode Platform Box -->
  <g transform="translate(550, 40)">
    <rect x="-70" y="-16" width="140" height="32" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="12">"GyanCode Platform"</text>
  </g>

  <!-- Supabase DB Box -->
  <g transform="translate(750, 40)">
    <rect x="-60" y="-16" width="120" height="32" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="12">"Supabase DB"</text>
  </g>


  <!-- ==================== ACTIVATION BARS ==================== -->
  <!-- 1. Educator Login -->
  <rect x="543" y="130" width="14" height="30" fill="#fff" stroke="#000" stroke-width="1"/>
  
  <!-- 2. Create Assignment -->
  <rect x="543" y="210" width="14" height="80" fill="#fff" stroke="#000" stroke-width="1"/>
  <rect x="743" y="230" width="14" height="30" fill="#fff" stroke="#000" stroke-width="1"/>

  <!-- 3. Student Login -->
  <rect x="543" y="340" width="14" height="30" fill="#fff" stroke="#000" stroke-width="1"/>

  <!-- 4. View Assignments -->
  <rect x="543" y="420" width="14" height="80" fill="#fff" stroke="#000" stroke-width="1"/>
  <rect x="743" y="440" width="14" height="30" fill="#fff" stroke="#000" stroke-width="1"/>

  <!-- 5. Submit Code -->
  <rect x="543" y="550" width="14" height="140" fill="#fff" stroke="#000" stroke-width="1"/>
  <rect x="743" y="630" width="14" height="30" fill="#fff" stroke="#000" stroke-width="1"/>

  <!-- 6. Educator Views Progress -->
  <rect x="543" y="740" width="14" height="80" fill="#fff" stroke="#000" stroke-width="1"/>
  <rect x="743" y="760" width="14" height="30" fill="#fff" stroke="#000" stroke-width="1"/>


  <!-- ==================== MESSAGE ARROWS & TEXT ==================== -->

  <!-- Flow 1: Educator Login -->
  <line x1="100" y1="130" x2="538" y2="130" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="325" y="123" text-anchor="middle">1. Logs in</text>

  <line x1="543" y1="160" x2="105" y2="160" stroke="#000" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#open-arrow)"/>
  <text x="325" y="153" text-anchor="middle">Confirms login</text>


  <!-- Flow 2: Create Assignment -->
  <line x1="100" y1="210" x2="538" y2="210" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="325" y="203" text-anchor="middle">2. createAssignment(details)</text>

  <line x1="557" y1="230" x2="738" y2="230" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="650" y="223" text-anchor="middle">Store new assignment</text>

  <line x1="743" y1="260" x2="562" y2="260" stroke="#000" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#open-arrow)"/>
  <text x="650" y="253" text-anchor="middle">Confirm assignment saved</text>

  <line x1="543" y1="290" x2="105" y2="290" stroke="#000" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#open-arrow)"/>
  <text x="325" y="283" text-anchor="middle">Assignment created successfully</text>


  <!-- Flow 3: Student Login -->
  <line x1="300" y1="340" x2="538" y2="340" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="425" y="333" text-anchor="middle">3. Logs in</text>

  <line x1="543" y1="370" x2="305" y2="370" stroke="#000" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#open-arrow)"/>
  <text x="425" y="363" text-anchor="middle">Confirms login</text>


  <!-- Flow 4: View Assignments -->
  <line x1="300" y1="420" x2="538" y2="420" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="425" y="413" text-anchor="middle">4. viewAssignments()</text>

  <line x1="557" y1="440" x2="738" y2="440" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="650" y="433" text-anchor="middle">Fetch assignments</text>

  <line x1="743" y1="470" x2="562" y2="470" stroke="#000" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#open-arrow)"/>
  <text x="650" y="463" text-anchor="middle">Return list of assignments</text>

  <line x1="543" y1="500" x2="305" y2="500" stroke="#000" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#open-arrow)"/>
  <text x="425" y="493" text-anchor="middle">Display assignments</text>


  <!-- Flow 5: Submit Code -->
  <line x1="300" y1="550" x2="538" y2="550" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="425" y="543" text-anchor="middle">5. submitCode(assignmentId, code)</text>

  <!-- Self Loop (Validate Code) -->
  <path d="M 557,575 L 590,575 L 590,600 L 562,600" fill="none" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- Decorative oval around self-loop exactly like reference -->
  <ellipse cx="583" cy="587" rx="20" ry="12" fill="none" stroke="#666" stroke-width="1"/>
  <text x="608" y="582" text-anchor="start">Validate code against expected output</text>

  <line x1="557" y1="630" x2="738" y2="630" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="650" y="623" text-anchor="middle">Update submission status &amp; points</text>

  <line x1="743" y1="660" x2="562" y2="660" stroke="#000" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#open-arrow)"/>
  <text x="650" y="653" text-anchor="middle">Confirm update</text>

  <line x1="543" y1="690" x2="305" y2="690" stroke="#000" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#open-arrow)"/>
  <text x="425" y="683" text-anchor="middle">6. Display result (Pass/Fail + Hint)</text>


  <!-- Flow 6: View Student Progress -->
  <line x1="100" y1="740" x2="538" y2="740" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="325" y="733" text-anchor="middle">7. viewStudentProgress()</text>

  <line x1="557" y1="760" x2="738" y2="760" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="650" y="753" text-anchor="middle">Fetch student progress data</text>

  <line x1="743" y1="790" x2="562" y2="790" stroke="#000" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#open-arrow)"/>
  <text x="650" y="783" text-anchor="middle">Return progress data</text>

  <line x1="543" y1="820" x2="105" y2="820" stroke="#000" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#open-arrow)"/>
  <text x="325" y="813" text-anchor="middle">Display progress dashboard</text>

</svg>
</div>

</body>
</html>

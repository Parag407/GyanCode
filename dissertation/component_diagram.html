<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>GyanCode – Component Diagram</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #f2f2f2;
  font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh; padding: 40px 20px;
}
.card {
  background: #fff;
  padding: 30px 35px 22px;
  border-radius: 10px;
  box-shadow: 0 4px 28px rgba(0,0,0,.18);
}
.diagram {
  position: relative;
  width: 960px; height: 620px;
}
.comp {
  position: absolute;
  border: 1.5px solid #000;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  font-size: 13px; font-weight: bold;
  line-height: 1.4; background: #fff;
}
.comp small { font-weight: normal; font-size: 11px; }

/* Component icon */
.comp-icon {
  position: absolute; top: 6px; right: 8px;
  width: 14px; height: 18px; border: 1.2px solid #000;
  background: #fff;
}
.comp-icon::before, .comp-icon::after {
  content: ''; position: absolute; left: -5px; width: 6px; height: 3px; 
  border: 1.2px solid #000; background: #fff;
}
.comp-icon::before { top: 2px; }
.comp-icon::after { bottom: 2px; }

svg { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
text.lbl { fill: #000; font-size: 11.5px; font-family: Arial; }
.title {
  margin-top: 18px; font-size: 23px; font-weight: bold;
  color: #000; text-align: center; font-family: Arial;
}

/* Arrow markers for required interfaces (dashed lines) */
</style>
</head>
<body>
<div class="card">
<div class="diagram">

  <!-- ==================== UI COMPONENTS (LEFT) ==================== -->
  
  <div class="comp" style="left:30px; top:180px; width:160px; height:70px">
    Student<br>Dashboard<br><small>&lt;&lt;UI&gt;&gt;</small>
    <div class="comp-icon"></div>
  </div>

  <div class="comp" style="left:30px; top:380px; width:160px; height:70px">
    Educator<br>Administration<br><small>&lt;&lt;UI&gt;&gt;</small>
    <div class="comp-icon"></div>
  </div>


  <!-- ==================== CORE COMPONENTS (MIDDLE) ================== -->

  <div class="comp" style="left:370px; top:80px; width:160px; height:70px">
    Authentication
    <div class="comp-icon"></div>
  </div>

  <div class="comp" style="left:370px; top:200px; width:160px; height:70px">
    User Profile &amp; Stats
    <div class="comp-icon"></div>
  </div>

  <div class="comp" style="left:370px; top:320px; width:160px; height:70px">
    Assignment Engine
    <div class="comp-icon"></div>
  </div>

  <div class="comp" style="left:370px; top:440px; width:160px; height:70px">
    Code Execution<br><small>&lt;&lt;component&gt;&gt;</small>
    <div class="comp-icon"></div>
  </div>


  <!-- ==================== INFRASTRUCTURE (RIGHT) ==================== -->

  <div class="comp" style="left:740px; top:160px; width:160px; height:70px">
    Security &amp; RLS<br><small>&lt;&lt;infrastructure&gt;&gt;</small>
    <div class="comp-icon"></div>
  </div>

  <div class="comp" style="left:740px; top:320px; width:160px; height:70px">
    Supabase DB<br><small>&lt;&lt;database&gt;&gt;</small>
    <div class="comp-icon"></div>
  </div>

  <div class="comp" style="left:740px; top:480px; width:160px; height:70px">
    AI LLM Services<br><small>&lt;&lt;external API&gt;&gt;</small>
    <div class="comp-icon"></div>
  </div>


  <svg viewBox="0 0 960 620" width="960" height="620">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0,0 L 10,5 L 0,10 Z" fill="#000"/>
      </marker>
      <marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0,0 L 10,5 L 0,10" fill="none" stroke="#000" stroke-width="1.5"/>
      </marker>
    </defs>

    <!-- UI to Interfaces (Dashed with open arrows) -->
    <!-- Student Dashboard to Auth -->
    <line x1="190" y1="200" x2="335" y2="115" stroke="#000" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#open-arrow)"/>
    <text x="250" y="145" class="lbl">AuthAccess</text>
    
    <!-- Student Dashboard to User Stats -->
    <line x1="190" y1="215" x2="335" y2="235" stroke="#000" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#open-arrow)"/>
    <text x="250" y="215" class="lbl">StudentData</text>

    <!-- Student Dashboard to Assignments -->
    <line x1="190" y1="225" x2="335" y2="340" stroke="#000" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#open-arrow)"/>
    <text x="235" y="285" class="lbl">ViewAssign</text>

    <!-- Student Dashboard to Code Execution -->
    <line x1="190" y1="230" x2="335" y2="460" stroke="#000" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#open-arrow)"/>
    <text x="230" y="375" class="lbl">SubmitCode</text>


    <!-- Educator UI to Auth -->
    <line x1="190" y1="400" x2="335" y2="125" stroke="#000" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#open-arrow)"/>
    <!-- Educator UI to User Stats -->
    <line x1="190" y1="410" x2="335" y2="245" stroke="#000" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#open-arrow)"/>
    <!-- Educator UI to Assignments -->
    <line x1="190" y1="415" x2="335" y2="355" stroke="#000" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#open-arrow)"/>
    <text x="235" y="440" class="lbl">ManageAssign</text>


    <!-- Interfaces for Middle Components (Lollipops) -->
    <!-- Circles at x=340 -->
    <circle cx="340" cy="115" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line x1="345" y1="115" x2="370" y2="115" stroke="#000" stroke-width="1.5"/>

    <circle cx="340" cy="125" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line x1="345" y1="125" x2="370" y2="125" stroke="#000" stroke-width="1.5"/>

    <circle cx="340" cy="235" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line x1="345" y1="235" x2="370" y2="235" stroke="#000" stroke-width="1.5"/>

    <circle cx="340" cy="245" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line x1="345" y1="245" x2="370" y2="245" stroke="#000" stroke-width="1.5"/>

    <circle cx="340" cy="340" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line x1="345" y1="340" x2="370" y2="340" stroke="#000" stroke-width="1.5"/>

    <circle cx="340" cy="355" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line x1="345" y1="355" x2="370" y2="355" stroke="#000" stroke-width="1.5"/>

    <circle cx="340" cy="460" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line x1="345" y1="460" x2="370" y2="460" stroke="#000" stroke-width="1.5"/>


    <!-- Internal Dependency Middle to Middle -->
    <!-- Assignment Engine requires Code Execution -->
    <path d="M 450,390 L 450,420 L 480,420 L 480,440" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#open-arrow)"/>


    <!-- Middle to Infrastructure (Security & DB) -->
    <!-- Auth to Security -->
    <line x1="530" y1="115" x2="685" y2="115" stroke="#000" stroke-width="1.5"/>
    <line x1="685" y1="115" x2="685" y2="185" stroke="#000" stroke-width="1.5"/>

    <!-- User Profile to Security -->
    <line x1="530" y1="230" x2="685" y2="230" stroke="#000" stroke-width="1.5"/>
    <line x1="685" y1="230" x2="685" y2="185" stroke="#000" stroke-width="1.5"/>
    
    <!-- User Profile to Persistence -->
    <line x1="530" y1="240" x2="630" y2="240" stroke="#000" stroke-width="1.5"/>
    <line x1="630" y1="240" x2="630" y2="355" stroke="#000" stroke-width="1.5"/>
    
    <!-- Assignment to Persistence -->
    <line x1="530" y1="355" x2="685" y2="355" stroke="#000" stroke-width="1.5"/>

    <!-- Code Execution to Persistence -->
    <line x1="530" y1="460" x2="650" y2="460" stroke="#000" stroke-width="1.5"/>
    <line x1="650" y1="460" x2="650" y2="355" stroke="#000" stroke-width="1.5"/>

    <!-- Security combined socket line -->
    <line x1="685" y1="185" x2="710" y2="185" stroke="#000" stroke-width="1.5"/>
    <!-- Socket at 715,185 -->
    <path d="M 720,175 A 10,10 0 0,0 720,195" fill="none" stroke="#000" stroke-width="1.5"/>
    <circle cx="725" cy="185" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line x1="730" y1="185" x2="740" y2="185" stroke="#000" stroke-width="1.5"/>
    <text x="615" y="175" class="lbl">Access Control</text>

    <!-- Persistence combined socket line -->
    <line x1="685" y1="355" x2="710" y2="355" stroke="#000" stroke-width="1.5"/>
    <!-- Socket at 715,355 -->
    <path d="M 720,345 A 10,10 0 0,0 720,365" fill="none" stroke="#000" stroke-width="1.5"/>
    <circle cx="725" cy="355" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line x1="730" y1="355" x2="740" y2="355" stroke="#000" stroke-width="1.5"/>
    <text x="625" y="345" class="lbl">Persistence</text>

    
    <!-- Security has Encryption interface (top) -->
    <circle cx="820" cy="130" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line x1="820" y1="135" x2="820" y2="160" stroke="#000" stroke-width="1.5"/>
    <text x="795" y="120" class="lbl">Encryption</text>

    <!-- DB requires ODBC/JDBC equivalent (Supabase API) -->
    <line x1="900" y1="355" x2="935" y2="355" stroke="#000" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#open-arrow)"/>
    <circle cx="945" cy="355" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="880" y="345" class="lbl">&lt;&lt;requires&gt;&gt;</text>
    <text x="930" y="375" class="lbl">REST</text>

    <!-- Code Execution implies requirement for AI services -->
    <!-- Code Execution to AI Services -->
    <line x1="530" y1="495" x2="730" y2="495" stroke="#000" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#open-arrow)"/>
    <circle cx="735" cy="495" r="5" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="590" y="485" class="lbl">&lt;&lt;req prompt eval&gt;&gt;</text>

  </svg>
</div>
<div class="title">Component Diagram – GyanCode Platform</div>
</div>
</body>
</html>
